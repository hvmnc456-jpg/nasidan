<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 다크 모드 — Android 흰 배경 flash 방지 -->
    <meta name="color-scheme" content="dark" />

    <!-- 뷰포트: viewport-fit=cover 로 노치/Dynamic Island 까지 full-screen -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Pretendard 폰트 CDN 사전 연결 (로드 지연 감소) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- PWA 아이콘 -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Android PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 테마 색상 (Android Chrome 툴바) -->
    <meta name="theme-color" content="#09090b" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="나.시.단" />

    <!-- MS Tile (Windows) -->
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />

    <title>나.시.단</title>

    <!-- 저장된 테마를 첫 페인트 전에 적용 (라이트 모드 깜빡임 방지) -->
    <script>
      (function () {
        try {
          var light = localStorage.getItem('theme') === 'light';
          if (light) document.documentElement.classList.add('light');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', light ? '#f4f4f5' : '#09090b');
          var cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute('content', light ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
