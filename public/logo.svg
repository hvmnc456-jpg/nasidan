<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 검은 배경 (앱 아이콘 모서리) -->
  <rect width="512" height="512" rx="100" fill="#09090b"/>
  <!--
    민소매 셔츠 (탱크탑) 실루엣
    - 몸통: x=56~456, y=208~434
    - 왼쪽 끈: x=136~196, y=88~190
    - 오른쪽 끈: x=316~376, y=88~190
    - 왼쪽 암홀: x=56~136, y=208 (몸통 왼쪽 어깨 컷)
    - 오른쪽 암홀: x=376~456, y=208 (몸통 오른쪽 어깨 컷)
    - U넥 라인: 양쪽 끈 사이 곡선
  -->
  <path
    d="
      M 56,434
      L 456,434
      L 456,208
      L 376,208
      L 376,88
      L 316,88
      L 316,188
      Q 256,262 196,188
      L 196,88
      L 136,88
      L 136,208
      L 56,208
      Z
    "
    fill="#a3e635"
  />
</svg>
